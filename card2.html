<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSSM Service Manager - Card View</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto bg-white shadow-xl rounded-xl p-6" x-data="nssmServiceManager()" x-init="fetchServers().then(fetchAllServices); startAutoRefresh()">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🚀 NSSM Service Manager - Card View</h1>
            <div class="flex items-center space-x-3">
                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-3">
                        <button class="text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition" @click="showInstallModal = true">Install New Service</button>
                        <span class="text-sm text-gray-600">Welcome, Admin</span>
                        <button class="text-sm bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition" @click="logout()">Logout</button>
                    </div>
                </template>
                <template x-if="!isLoggedIn">
                    <button class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition" @click="showLoginModal = true">Login</button>
                </template>
            </div>
        </div>

        <!-- Server Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="server in servers" :key="server.ip">
                <div
                    class="rounded-xl shadow-md p-5 transition transform hover:scale-[1.01] cursor-pointer relative"
                    :class="servicesByServer[server.ip] === undefined
                            ? 'bg-gray-200 border border-gray-400'
                            : getServerHealth(server.ip)
                                ? 'bg-green-100 border border-green-400'
                                : 'bg-red-100 border border-red-400'"
                    @click="selectedServer = 'http://' + server.ip + ':54321'; fetchServices();">
                    <div class="absolute top-3 right-3" x-show="refreshingServers.includes(server.ip)">
                        <div class="animate-spin h-5 w-5 border-t-2 border-blue-500 border-solid rounded-full"></div>
                    </div>
                    <h2 class="text-xl font-semibold mb-3 text-gray-800" x-text="server.name + ' (' + server.ip + ')' "></h2>
                    <ul class="space-y-1 text-sm">
                        <template x-if="servicesByServer[server.ip] === undefined">
                            <li class="text-gray-500 italic">Error connecting to server</li>
                        </template>
                        <template x-if="servicesByServer[server.ip] !== undefined">
                            <template x-for="service in servicesByServer[server.ip] || []" :key="service.service_name">
                                <li class="flex justify-between">
                                    <span x-text="service.service_name"></span>
                                    <span :class="service.Status === 'SERVICE_RUNNING' ? 'text-green-700' : 'text-red-700'" x-text="service.Status"></span>
                                </li>
                            </template>
                        </template>
                    </ul>
                </div>
            </template>
        </div>

        <!-- Notification -->
        <div class="mt-6" x-show="message">
            <p class="p-3 bg-green-100 text-green-700 rounded-lg" x-text="message"></p>
        </div>
    </div>

    <script>
        function nssmServiceManager() {
            return {
                servicesByServer: {},
                servers: [],
                selectedServer: '',
                isLoggedIn: localStorage.getItem("loggedIn") === "true",
                showInstallModal: false,
                loginForm: { username: '', password: '' },
                showLoginModal: false,
                refreshRate: 5,
                refreshInterval: null,
                message: '',
                refreshingServers: [],

                async fetchServers() {
                    try {
                        let response = await fetch('http://192.168.32.29:30/nssm/sqlite-api/');
                        let data = await response.json();
                        this.servers = data;
                    } catch (error) {
                        console.error("Error fetching servers:", error);
                        this.message = "Error fetching server list";
                    }
                },

                async fetchAllServices() {
                    for (let server of this.servers) {
                        this.refreshingServers.push(server.ip);
                        try {
                            let url = `http://${server.ip}:54321/services`;
                            let response = await fetch(url);
                            let data = await response.json();
                            this.servicesByServer[server.ip] = data.services || [];
                        } catch (error) {
                            this.servicesByServer[server.ip] = undefined;
                        } finally {
                            this.refreshingServers = this.refreshingServers.filter(ip => ip !== server.ip);
                        }
                    }
                },

                getServerHealth(ip) {
                    let services = this.servicesByServer[ip] || [];
                    return services.every(s => s.Status === 'SERVICE_RUNNING');
                },

                fetchServices() {
                    let ip = this.selectedServer.split('/')[2].split(':')[0];
                    if (!ip) return;
                    this.refreshingServers.push(ip);
                    fetch(`${this.selectedServer}/services`)
                        .then(res => res.json())
                        .then(data => {
                            this.servicesByServer[ip] = data.services;
                        })
                        .catch(() => {
                            this.servicesByServer[ip] = undefined;
                        })
                        .finally(() => {
                            this.refreshingServers = this.refreshingServers.filter(s => s !== ip);
                        });
                },

                startAutoRefresh() {
                    if (this.refreshInterval) clearInterval(this.refreshInterval);
                    this.refreshInterval = setInterval(() => {
                        this.fetchAllServices();
                    }, this.refreshRate * 1000);
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem("loggedIn");
                    this.message = "Logged out successfully.";
                },

                login() {
                    if (this.loginForm.username === "admin" && this.loginForm.password === "admin") {
                        this.isLoggedIn = true;
                        localStorage.setItem("loggedIn", "true");
                        this.showLoginModal = false;
                        this.message = "Login successful!";
                    } else {
                        this.message = "Invalid credentials.";
                    }
                }
            }
        }
    </script>
</body>
</html>
